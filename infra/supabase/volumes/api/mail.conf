# Included into Kong's nginx (KONG_NGINX_HTTP_INCLUDE in docker-compose.yml): serves the e-mail templates of
# volumes/api/mail/ to Auth, which reads its templates only over HTTP. The port is not published on the host and
# is not one of Kong's routes — it is reachable only inside the stack's Docker network, as http://kong:8088/mail/….
server {
  listen 8088;
  access_log off;

  location /mail/ {
    alias /home/kong/mail/;
    default_type text/html;
    charset utf-8;
  }

  location / {
    return 404;
  }
}
