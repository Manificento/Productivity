# Self-hosted Supabase for LifeOS, one region (cell) per compose project — ADR-0009.
# Trimmed from https://github.com/supabase/supabase/tree/master/docker: no Realtime, Storage, imgproxy, Edge Runtime,
# Analytics or Supavisor. Postgres has no published port: it is reachable only inside this project's Docker network.
# Run through the scripts (deploy.sh …), which pass `--env-file` and the per-region project name.
#
# Studio (database admin UI) is opt-in: `docker compose --profile studio up -d`, then an SSH tunnel to 127.0.0.1:3000.

services:
  kong:
    image: kong:3.9.4
    restart: unless-stopped
    ports:
      # 127.0.0.1 by default: a TLS reverse proxy on the host publishes the API (README, «Домен и TLS»).
      - ${KONG_BIND:-127.0.0.1}:${KONG_HTTP_PORT:-8000}:8000/tcp
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro
    labels:
      # sha256 of kong.yml (lib.sh, `compose`): a changed file recreates the container, which reads it only at start.
      lifeos.config-sha256: ${KONG_CONFIG_SHA256:-}
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      # Docker's DNS answers with a 600 s TTL; re-resolve often so a restarted service is found at its new address.
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY:?}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
    # Substitutes the API keys into the declarative config, then starts Kong.
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > /tmp/kong.yml && /docker-entrypoint.sh kong docker-start'
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:?}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:?}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-LifeOS}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'postgrest', '--ready']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ['postgrest']

  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    # No `ports:` on purpose — Postgres stays inside the Docker network (backup.sh uses `docker compose exec`).
    volumes:
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf', '-c', 'log_min_messages=fatal']

  # HTTPS reverse proxy in front of Kong (opt-in profile `proxy`, turned on on the server by provision.sh through
  # COMPOSE_PROFILES): Caddy gets and renews a Let's Encrypt certificate for API_DOMAIN on ports 80 and 443.
  proxy:
    image: caddy:2.10.2-alpine
    profiles: [proxy]
    restart: unless-stopped
    # Host network: Caddy takes the host's ports 80/443 and reaches Kong on 127.0.0.1, where Kong is published.
    network_mode: host
    depends_on:
      kong:
        condition: service_healthy
    volumes:
      - ./volumes/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    labels:
      # sha256 of the Caddyfile (lib.sh, `compose`): a changed file recreates the container (no admin API to reload).
      lifeos.config-sha256: ${PROXY_CONFIG_SHA256:-}
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      KONG_HTTP_PORT: ${KONG_HTTP_PORT:-8000}
      PROXY_HTTP_PORT: ${PROXY_HTTP_PORT:-80}
      PROXY_HTTPS_PORT: ${PROXY_HTTPS_PORT:-443}

  meta:
    image: supabase/postgres-meta:v0.100.0
    profiles: [studio]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?}

  studio:
    image: supabase/studio:2026.11.02-sha-a05e7ec
    profiles: [studio]
    restart: unless-stopped
    ports:
      - 127.0.0.1:${STUDIO_PORT:-3000}:3000/tcp
    depends_on:
      - meta
    environment:
      HOSTNAME: '0.0.0.0'
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?}
      PGRST_DB_SCHEMAS: public
      DEFAULT_ORGANIZATION_NAME: LifeOS
      DEFAULT_PROJECT_NAME: lifeos-${REGION:?}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?}
      SUPABASE_ANON_KEY: ${ANON_KEY:?}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
      AUTH_JWT_SECRET: ${JWT_SECRET:?}
      ENABLED_FEATURES_LOGS_ALL: 'false'

volumes:
  db-data:
  db-config:
  # The proxy's certificates: kept between deploys, so Let's Encrypt is not asked again every time.
  proxy-data:
  proxy-config:
