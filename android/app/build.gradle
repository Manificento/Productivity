apply plugin: 'com.android.application'

// Release signing and version (#285, README «Подпись release-сборки Android»). Every value comes from an environment
// variable or a Gradle property of the same name (-PNAME=…, ~/.gradle/gradle.properties); the repository holds no key
// and no password. Without all four signing values the release build stays unsigned and Play will not accept it.
def fromEnvOrProperty = { String name -> providers.environmentVariable(name).orElse(providers.gradleProperty(name)).getOrNull() }
def releaseSigning = [
    storeFile    : fromEnvOrProperty('ANDROID_KEYSTORE_FILE'),
    storePassword: fromEnvOrProperty('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias     : fromEnvOrProperty('ANDROID_KEY_ALIAS'),
    keyPassword  : fromEnvOrProperty('ANDROID_KEY_PASSWORD'),
]
def hasReleaseSigning = releaseSigning.values().every { it }
// versionCode — the CI run number (grows with every run, Play needs a new one for each upload); versionName — the
// tag without «v» or the version in package.json.
def appVersionCode = (fromEnvOrProperty('LIFEOS_VERSION_CODE') ?: '1') as int
def appVersionName = fromEnvOrProperty('LIFEOS_VERSION_NAME') ?:
    new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version

android {
    namespace = "com.manificento.lifeos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.manificento.lifeos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Robolectric tests of the native alarm screen (#233) read the app's resources and manifest. The Android jar
    // Robolectric runs on comes through Gradle (proxy, cache) and Robolectric runs offline.
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            dependsOn 'robolectricJars'
            systemProperty 'robolectric.offline', 'true'
            systemProperty 'robolectric.dependency.dir', layout.buildDirectory.dir('robolectric-jars').get().asFile.path
        }
    }
    signingConfigs {
        release {
            storeFile releaseSigning.storeFile ? file(releaseSigning.storeFile) : null
            storePassword releaseSigning.storePassword
            keyAlias releaseSigning.keyAlias
            keyPassword releaseSigning.keyPassword
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

configurations {
    robolectricRuntime { transitive = false }
}

// Android 13 for Robolectric 4.16 (AlarmScreenTest runs with @Config(sdk = 33)).
tasks.register('robolectricJars', Copy) {
    from configurations.robolectricRuntime
    into layout.buildDirectory.dir('robolectric-jars')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    robolectricRuntime "org.robolectric:android-all-instrumented:13-robolectric-9030017-i7"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
