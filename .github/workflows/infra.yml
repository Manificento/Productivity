name: Infra

# Supabase self-hosted as code (infra/supabase, issue #172): the stack is deployed into the runner's Docker and
# checked on every change of infra/; the restore drill (backup → MinIO → restore on an empty stack) also runs weekly,
# so a broken backup is noticed within a week even when nobody touches infra/. The script of the «Deploy KZ» workflow
# runs over SSH against a test server (the runner itself, MinIO instead of the bucket) — issue #284. The SQL
# migrations of infra/supabase/migrations/ are applied to an empty database and row level security is checked with
# two users through the real API — issue #277. The account — the sign-in letter (caught by a mail trap, no real mail),
# profiles, the consent journal, the age rule and account deletion — is checked the same way — issue #278; the
# counters of sign-in attempts are also run by themselves in the pinned Kong image, with their memory zone full.
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/workflows/deploy-kz.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/workflows/deploy-kz.yml']
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

concurrency:
  # A push to main must not cancel the weekly restore drill.
  group: infra-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x infra/supabase/*.sh infra/supabase/tests/*.sh
      - run: docker compose -f infra/supabase/docker-compose.yml --env-file infra/supabase/env.example config --quiet
        env:
          # config needs the required secrets set; these dummies never reach a running stack.
          POSTGRES_PASSWORD: x
          JWT_SECRET: x
          ANON_KEY: x
          SERVICE_ROLE_KEY: x
          PG_META_CRYPTO_KEY: x

  stack:
    name: Deploy, two regions, alerts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: infra/supabase/tests/stack.test.sh

  restore:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: infra/supabase/tests/backup-restore.test.sh

  migrations:
    name: Migrations on an empty database, RLS with two users
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: infra/supabase/tests/migrations.test.sh

  account:
    name: Account — sign-in letter, consents and age (RLS with two users), account deletion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: infra/supabase/tests/account.test.sh

  otp-attempts:
    name: Sign-in attempts — the limit per client, the counters in a full memory zone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: infra/supabase/tests/otp-attempts.test.sh

  deploy-remote:
    name: Deploy KZ over SSH to a test server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The test server is the runner itself: the test starts its own sshd and uses the runner user's crontab.
      - name: sshd and cron on the runner
        run: |
          if [ ! -x /usr/sbin/sshd ] || ! command -v crontab > /dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q openssh-server cron
          fi
      - run: infra/supabase/tests/deploy-remote.test.sh
