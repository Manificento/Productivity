name: Android

# Debug APK for PRs that touch the native shell (ADR-0008). iOS joins after the Apple account (owner, P2).
on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/core/platform.ts'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
        working-directory: android
      # Google Play asks to justify every health permission: only sleep and workouts may be read (#141).
      - name: Health permissions are only READ_SLEEP and READ_EXERCISE
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          ACTUAL=$("$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | grep -o "android.permission.health.[A-Z0-9_]*" | sort | tr '\n' ' ')
          EXPECTED="android.permission.health.READ_EXERCISE android.permission.health.READ_SLEEP "
          echo "health permissions: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
