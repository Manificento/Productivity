name: Android

# Debug APK for PRs that touch the native shell (ADR-0008). iOS joins after the Apple account (owner, P2).
# Signed release (#285, README «Подпись release-сборки Android»): every PR checks the signing path on a throwaway
# keystore made inside the job; the release with the app's upload key is built only by a manual run or a tag v*, from
# the repository secrets. Without them the release job is skipped with a notice and the run stays green.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/core/platform.ts'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - '.github/workflows/android.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Play needs a new versionCode for every upload: the run number of this workflow only grows.
  LIFEOS_VERSION_CODE: ${{ github.run_number }}

jobs:
  apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
        working-directory: android
      # Health permissions are only READ_SLEEP and READ_EXERCISE (#141); the privacy policy is in the APK and the
      # policy URL points at it (#214). The release build passes the same script in the next step.
      - name: Health permissions and privacy policy of the debug APK
        run: android/scripts/check-apk.sh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Подпись release проверена на одноразовом keystore (apksigner verify), release проходит те же проверки, что debug
        run: android/scripts/test-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signing-gate:
    name: Release signing gate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: shellcheck -x android/scripts/*.sh android/scripts/tests/*.sh
      - name: Ключи подписи — только из секретов, keystore-файлов в репозитории нет, шлюз release-задания
        run: android/scripts/tests/signing.test.sh
      # Secrets never reach a pull_request run (from a fork they are empty anyway): only the job below uses them.
      - name: Секреты подписи заданы
        id: gate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: android/scripts/release-secrets.sh

  release:
    name: Android signed release (AAB + APK)
    needs: [apk, signing-gate]
    # Skipped (not failed) on PRs and without the secrets: the gate has already said why in a notice.
    if: github.event_name != 'pull_request' && needs.signing-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No secrets at the job level: only the two steps that need them get them. No caches: a release is built from
    # a clean checkout, not from what other runs stored.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Keystore из секрета
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Подписанные release AAB и APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: android/scripts/build-release.sh
      # Before any third-party step that follows: the key does not outlive the build.
      - name: Удалить keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          # The run number is the versionCode inside: the artifact name says which upload it is.
          name: lifeos-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
