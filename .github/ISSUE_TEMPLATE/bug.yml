name: Ошибка
description: Что-то работает не так
labels: ['type:bug']
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть «Задачи»
        2. Ввести «завтра 9:00 позвонить»
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидалось / получилось
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и браузер
      placeholder: Android 15, Chrome
